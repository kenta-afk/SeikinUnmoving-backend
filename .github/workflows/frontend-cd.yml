name: Frontend CD

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-cd.yml'

jobs:
  deploy-frontend:
    name: Deploy Frontend (EAS Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build for iOS (Production)
        run: eas build --platform ios --profile production --non-interactive --no-wait
        if: github.ref == 'refs/heads/main'

      - name: Build for Android (Production)
        run: eas build --platform android --profile production --non-interactive --no-wait
        if: github.ref == 'refs/heads/main'

      # Webデプロイの場合（Cloudflare Pagesなど）
      - name: Build Web
        run: npx expo export -p web

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=seikin-frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
