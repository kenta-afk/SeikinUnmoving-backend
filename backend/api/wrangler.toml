name = "seikin-backend"
main = "build/worker/shim.mjs"
compatibility_date = "2024-10-28"

# 環境変数（非機密情報）
[vars]
LOG_LEVEL = "INFO"

# 本番環境
[env.production]
name = "seikin-backend-production"

[env.production.vars]
LOG_LEVEL = "INFO"

# ========================================
# 今後必要に応じて追加:
# ========================================

# D1データベース（SQLite互換）
# 開発環境用：ローカルSQLiteファイルを使用
[[d1_databases]]
binding = "DB"
database_name = "seikin-db"
database_id = "7024845a-2b00-4cb5-a0a3-87fc7dead454"
preview_database_id = "DB"  # 開発時はプレビューDBを使用
migrations_dir = "../db/migrations"

# 本番環境のD1設定
[[env.production.d1_databases]]
binding = "DB"
database_name = "seikin-db"
database_id = "7024845a-2b00-4cb5-a0a3-87fc7dead454"
migrations_dir = "../db/migrations"

# KVストア（Redis/Valkey代替）
# [[kv_namespaces]]
# binding = "KV"
# id = "your-kv-id"  # wrangler kv:namespace create "seikin-kv" で取得

# シークレット（機密情報）は以下のコマンドで設定：
# wrangler secret put API_KEY
# wrangler secret put JWT_SECRET
