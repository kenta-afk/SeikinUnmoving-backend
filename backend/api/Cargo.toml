[package]
name = "api"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

# 独立したプロジェクトとして扱う（親ワークスペースから除外）
[workspace]

[dependencies]
worker = { version = "0.7.4", features = ["d1"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
console_error_panic_hook = "0.1.7"
async-trait = "0.1.89"
base64 = "0.22"
uuid = { version = "1.11.0", features = ["v7", "v4", "serde"] }
userservice = { path = "../services/userservice" }
gameservice = { path = "../services/gameservice" }
rankingservice = { path = "../services/rankingservice" }
once_cell = "1.20"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = "z"     # 最小サイズに最適化
lto = true          # Link Time Optimization
codegen-units = 1   # 最適化を向上
