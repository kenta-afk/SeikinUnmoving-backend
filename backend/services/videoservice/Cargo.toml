[package]
name = "videoservice"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.42", features = ["serde", "wasmbind"] }
getrandom = { version = "0.2", features = ["js"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.17"
uuid = { version = "1.18.1", features = ["v7", "serde", "js"] }
utoipa = { version = "5.4.0", features = ["chrono"], optional = true }

[features]
utoipa = ["dep:utoipa"]

# ローカル開発環境用（WASM以外）
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sqlx = { version = "0.8.6", features = ["sqlite", "chrono", "runtime-tokio"] }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
mockall = "0.13.1"
rstest = "0.26.1"
