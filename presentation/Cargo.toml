[package]
name = "apiroute"
version = "0.1.0"
edition = "2024"

[dependencies]
userservice = { path = "../services/userservice" }
gameservice = { path = "../services/gameservice" }
rankingservice = { path = "../services/rankingservice" }
worker = "0.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
console_error_panic_hook = "0.1"
utoipa = { version = "5.4.0", features = ["macros"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
axum-extra = { version = "0.12.3", features = ["cookie"] }
tower-http = { version = "0.6.8", features = ["cors"] }
async-trait = "0.1.89"
jsonwebtoken = "10.2.0"

# 開発環境用（Dockerなど）
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = "0.8.6"
dotenv = "0.15.0"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
sqlx = { version = "0.8.6", features = ["sqlite", "chrono", "runtime-tokio"] }
