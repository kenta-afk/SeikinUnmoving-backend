[package]
name = "userservice"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = { version = "0.6.0-rc.2", features = ["getrandom"] }
async-trait = "0.1.89"
chrono = { version = "0.4.42", features = ["serde"] }
hex = "0.4.3"
jsonwebtoken = { version = "10.2.0", features = ["aws_lc_rs"] }
rand = "0.9.2"
serde = "1.0.228"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", features = ["sqlite", "chrono", "uuid"] }
thiserror = "2.0.17"
tokio = "1.48.0"
uuid = { version = "1.18.1", features = ["v7", "serde"] }

[dev-dependencies]
mockall = "0.13.1"
rstest = "0.26.1"
